[package]
name = "ikigai-knowledge"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Grounded, cited answers over an organization's documents, as ikigai resources: source declarations, lifts, passages, drafts, entities and answers, each a resource under the caller's capability."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-knowledge"
readme = "README.md"
keywords = ["ikigai", "roc", "rdf", "knowledge", "module"]
categories = ["wasm", "text-processing"]

[dependencies]
# The released kernel, consumed from crates.io, so a host links exactly one `ikigai-core`.
# 0.3.5 is the newest release: this crate uses `Invocation::depends_on` on a miss (core
# 0.1.93, ledger #1079), the declared-capability floor and `space_iri`, all older than 0.3.0,
# so the TRUE floor is 0.3.0, the line the hosts run; 0.3.5 is stated so a fresh resolve and
# CI's cached index agree on one core. ⚠ Under 0.x a caret is a range: `<0.4.0`.
ikigai-core = "0.3.5"
# The source endpoint reads through the kernel, whose `invoke` is `async_trait`.
async-trait = "0.1"
blake3 = "1"
# A source declaration is Turtle: parsed (to refuse a malformed or blank-node declaration
# and to resolve `<>` against the source's own name) and written back by the RDF library,
# never by hand. The pair the ecosystem already links (ikigai-inquiry, oxigraph's).
# oxttl pins oxrdf exactly (`=0.3.5` for oxttl 0.2.5), so these floors move together.
# ⚠ `"0.3.5"` is `<0.4.0` and `"0.2.5"` is `<0.3.0`.
oxrdf = "0.3.5"
oxttl = "0.2.5"

# oxrdf draws on `rand` for blank-node ids; on wasm32-unknown-unknown its entropy comes from
# the JS host (ikigai-inquiry and ikigai-rdf do the same). This crate never mints a blank node.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
futures = "0.3"
# The store the work ledger lives in, so the tests read the ledger's named graphs through the
# NARROW doors (`urn:iki:store:graph-construct`, `urn:iki:store:graphs`) under published
# grants, the way a host serves them. A DEV-dependency only: this crate reaches the store
# through the kernel, by IRI. 0.5.0 is the newest release, on core 0.3.
# ⚠ `"0.5.0"` is `<0.6.0`.
ikigai-store = "0.5.0"
# The file module a host binds at `urn:knowledge:file:path:{path}` over the config home's
# `knowledge` directory, so the tests read declarations the way a host serves them. A
# DEV-dependency only: which file module answers there is the host's choice, and this crate
# opens no file itself (Hypothesis H). 0.4.2 is the newest file module on core 0.3.
# ⚠ `"0.4.2"` is `<0.5.0`.
ikigai-fs = "0.4.2"
# The module recipe as one test (`tests/conformance.rs`). 0.14.0 is the newest release and
# the conformance on core 0.3.0; every check runs by default since 0.12.0.
# ⚠ `"0.14.0"` is `<0.15.0`.
ikigai-conformance = "0.14.0"
